name: A1 finance validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/p0-test-fixtures/a1-finance-base.sql"
      - ".github/workflows/a1-finance-validation.yml"
      - "supabase/migrations/20260801210000_a1_finance_fail_closed.sql"
      - "supabase/tests/a1_finance_fail_closed.test.sql"

permissions:
  contents: read

concurrency:
  group: a1-finance-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  database:
    name: A1 migration and pgTAP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Prepare isolated A1 database project
        env:
          A1_WORKDIR: ${{ runner.temp }}/a1-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$A1_WORKDIR/supabase/migrations" "$A1_WORKDIR/supabase/tests"
          cp supabase/config.toml "$A1_WORKDIR/supabase/config.toml"
          cp .github/p0-test-fixtures/a1-finance-base.sql "$A1_WORKDIR/supabase/migrations/20260801200000_a1_finance_base.sql"
          cp supabase/migrations/20260801210000_a1_finance_fail_closed.sql "$A1_WORKDIR/supabase/migrations/20260801210000_a1_finance_fail_closed.sql"
          cp supabase/migrations/20260801210000_a1_finance_fail_closed.sql "$A1_WORKDIR/supabase/migrations/20260801210001_a1_finance_idempotency.sql"
          cp supabase/tests/a1_finance_fail_closed.test.sql "$A1_WORKDIR/supabase/tests/"

      - name: Start isolated database and apply A1 twice
        env:
          A1_WORKDIR: ${{ runner.temp }}/a1-${{ github.run_id }}-${{ github.run_attempt }}
        run: supabase db start --workdir "$A1_WORKDIR"

      - name: Run A1 database tests
        env:
          A1_WORKDIR: ${{ runner.temp }}/a1-${{ github.run_id }}-${{ github.run_attempt }}
        run: supabase test db --workdir "$A1_WORKDIR"
