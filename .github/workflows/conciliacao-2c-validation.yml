name: Conciliacao 2c validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/p0-test-fixtures/conciliacao-base.sql"
      - ".github/workflows/conciliacao-2c-validation.yml"
      - "supabase/migrations/20260811150000_conciliacao_2c1_parser_version.sql"
      - "supabase/tests/conciliacao_2c1_parser_version.test.sql"

permissions:
  contents: read

concurrency:
  group: conciliacao-2c-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  database:
    name: Conciliacao migration and pgTAP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Prepare isolated conciliacao database project
        env:
          CONC_WORKDIR: ${{ runner.temp }}/conciliacao-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$CONC_WORKDIR/supabase/migrations" "$CONC_WORKDIR/supabase/tests"
          cp supabase/config.toml "$CONC_WORKDIR/supabase/config.toml"
          cp .github/p0-test-fixtures/conciliacao-base.sql "$CONC_WORKDIR/supabase/migrations/20260811140000_conciliacao_base.sql"
          cp supabase/migrations/20260811150000_conciliacao_2c1_parser_version.sql "$CONC_WORKDIR/supabase/migrations/20260811150000_conciliacao_2c1_parser_version.sql"
          # Entre as duas aplicações nasce um import 'unknown' (a janela A4:
          # Edge antiga no ar depois da migration). A reaplicação NÃO pode
          # reclassificá-lo como legacy_untrusted — o pgTAP verifica.
          echo "INSERT INTO public.bank_imports (file_name, file_type, status) VALUES ('janela_a4_sem_versao.ofx', 'ofx', 'completed');" > "$CONC_WORKDIR/supabase/migrations/20260811150001_seed_janela_a4.sql"
          cp supabase/migrations/20260811150000_conciliacao_2c1_parser_version.sql "$CONC_WORKDIR/supabase/migrations/20260811150002_conciliacao_2c1_idempotency.sql"
          cp supabase/tests/conciliacao_2c1_parser_version.test.sql "$CONC_WORKDIR/supabase/tests/"

      - name: Start isolated database and apply migration twice
        env:
          CONC_WORKDIR: ${{ runner.temp }}/conciliacao-${{ github.run_id }}-${{ github.run_attempt }}
        run: supabase db start --workdir "$CONC_WORKDIR"

      - name: Run conciliacao database tests
        env:
          CONC_WORKDIR: ${{ runner.temp }}/conciliacao-${{ github.run_id }}-${{ github.run_attempt }}
        run: supabase test db --workdir "$CONC_WORKDIR"
