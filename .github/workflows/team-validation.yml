name: Team T1 validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/p0-test-fixtures/team-base.sql"
      - ".github/scripts/team-concurrency-check.sh"
      - ".github/scripts/team-mutants.sh"
      - ".github/scripts/team-sql-mutants.sh"
      - ".github/workflows/team-validation.yml"
      - "supabase/migrations/20260812150000_team_t1_roles_hardening.sql"
      - "supabase/tests/team_t1_hardening.test.sql"
      - "supabase/functions/_shared/team/**"
      - "supabase/functions/manage-team/**"
      - "supabase/config.toml"
      - "supabase/functions/deno.lock"
      - "docs/RUNBOOK_TEAM_T1.md"

permissions:
  contents: read

concurrency:
  group: team-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    name: manage-team unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run supabase/functions/_shared/team
      - name: Normative mutants must die
        run: |
          chmod +x .github/scripts/team-mutants.sh
          .github/scripts/team-mutants.sh

  database:
    name: Migration + pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Prepare isolated team database project
        env:
          TEAM_WORKDIR: ${{ runner.temp }}/team-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$TEAM_WORKDIR/supabase/migrations" "$TEAM_WORKDIR/supabase/tests"
          cp supabase/config.toml "$TEAM_WORKDIR/supabase/config.toml"
          cp .github/p0-test-fixtures/team-base.sql "$TEAM_WORKDIR/supabase/migrations/20260812140000_team_base.sql"
          cp supabase/migrations/20260812150000_team_t1_roles_hardening.sql "$TEAM_WORKDIR/supabase/migrations/20260812150000_team_t1_roles_hardening.sql"
          cp supabase/migrations/20260812150000_team_t1_roles_hardening.sql "$TEAM_WORKDIR/supabase/migrations/20260812150001_team_t1_idempotency.sql"
          cp supabase/tests/team_t1_hardening.test.sql "$TEAM_WORKDIR/supabase/tests/"
      - name: Start isolated database and apply migration twice
        env:
          TEAM_WORKDIR: ${{ runner.temp }}/team-${{ github.run_id }}-${{ github.run_attempt }}
        run: supabase db start --workdir "$TEAM_WORKDIR"
      - name: Run team database tests
        env:
          TEAM_WORKDIR: ${{ runner.temp }}/team-${{ github.run_id }}-${{ github.run_attempt }}
        run: supabase test db --workdir "$TEAM_WORKDIR"

  integration:
    name: Concurrency (2 conexoes) + cascade deleteUser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Prepare isolated team database project
        env:
          TEAM_WORKDIR: ${{ runner.temp }}/team-int-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$TEAM_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$TEAM_WORKDIR/supabase/config.toml"
          cp .github/p0-test-fixtures/team-base.sql "$TEAM_WORKDIR/supabase/migrations/20260812140000_team_base.sql"
          cp supabase/migrations/20260812150000_team_t1_roles_hardening.sql "$TEAM_WORKDIR/supabase/migrations/20260812150000_team_t1_roles_hardening.sql"
          # a Edge REAL vai ser servida: leva as functions inteiras
          cp -R supabase/functions "$TEAM_WORKDIR/supabase/functions"
      - name: Start full local stack (Auth + PostgREST reais)
        env:
          TEAM_WORKDIR: ${{ runner.temp }}/team-int-${{ github.run_id }}-${{ github.run_attempt }}
        run: supabase start --workdir "$TEAM_WORKDIR" -x studio,imgproxy,inbucket,logflare,vector
      - name: Concurrency harness (2 real connections)
        run: |
          chmod +x .github/scripts/team-concurrency-check.sh
          .github/scripts/team-concurrency-check.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - name: SQL mutants must die (7 normativos)
        env:
          TEAM_WORKDIR: ${{ runner.temp }}/team-int-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          chmod +x .github/scripts/team-sql-mutants.sh .github/scripts/team-concurrency-check.sh
          .github/scripts/team-sql-mutants.sh \
            "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            supabase/migrations/20260812150000_team_t1_roles_hardening.sql
      - name: Real Admin API deleteUser honors the guard
        env:
          TEAM_WORKDIR: ${{ runner.temp }}/team-int-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          eval "$(supabase status --workdir "$TEAM_WORKDIR" -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY)=')"
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          del() { curl -s -o /tmp/del.out -w "%{http_code}" -X DELETE \
            "$API_URL/auth/v1/admin/users/$1" \
            -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY"; }
          # instrutor sai pela API real: cascade limpa papéis
          CODE=$(del "00000000-0000-0000-0000-00000000000c")
          [ "$CODE" -lt 300 ] || { echo "deleteUser do instrutor falhou ($CODE)"; cat /tmp/del.out; exit 1; }
          LEFT=$(psql "$DB" -qtA -c \
            "SELECT count(*) FROM public.user_roles WHERE user_id = '00000000-0000-0000-0000-00000000000c'")
          test "$LEFT" = "0" || { echo "cascade não limpou papéis do instrutor"; exit 1; }
          # um dos 2 admins sai; o restante é o último
          CODE=$(del "00000000-0000-0000-0000-00000000000b")
          [ "$CODE" -lt 300 ] || { echo "deleteUser do admin B falhou ($CODE)"; exit 1; }
          # o ÚLTIMO admin não sai: o guard aborta o delete da API inteira
          CODE=$(del "00000000-0000-0000-0000-00000000000a")
          [ "$CODE" -ge 400 ] || { echo "deleteUser do último admin deveria falhar, veio $CODE"; exit 1; }
          STILL=$(psql "$DB" -qtA -c \
            "SELECT count(*) FROM auth.users WHERE id = '00000000-0000-0000-0000-00000000000a'")
          test "$STILL" = "1" || { echo "último admin sumiu do auth.users"; exit 1; }
          echo "Admin API OK: guard bloqueia deleteUser do último admin ($CODE)"
      - name: PostgREST maps SQLSTATE by code (T0002)
        env:
          TEAM_WORKDIR: ${{ runner.temp }}/team-int-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          eval "$(supabase status --workdir "$TEAM_WORKDIR" -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY|ANON_KEY)=')"
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          # JWT REAL de admin (o ator das RPCs é auth.uid())
          ADMIN_ID="00000000-0000-0000-0000-00000000000a"
          curl -s -X PUT "$API_URL/auth/v1/admin/users/$ADMIN_ID" \
            -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"password":"senha-ci-12345","email_confirm":true}' > /dev/null
          JWT=$(curl -s -X POST "$API_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d '{"email":"admin1@fabrik.test","password":"senha-ci-12345"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          [ -n "$JWT" ] || { echo "password grant falhou"; exit 1; }
          # admin com lease inválido → o corpo do PostgREST traz code T0002
          BODY=$(curl -s -X POST "$API_URL/rest/v1/rpc/team_set_roles" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            -d '{"p_operation_id":"99999999-0000-0000-0000-0000000000aa","p_lease_token":"99999999-0000-0000-0000-0000000000bb","p_roles":["instructor"]}')
          echo "$BODY" | grep -q '"code":"T0002"' || { echo "esperado code T0002 no corpo: $BODY"; exit 1; }
          # service_role NÃO executa a saga (privilégio revogado — fria r2)
          CODE=$(curl -s -o /tmp/svc.out -w "%{http_code}" -X POST "$API_URL/rest/v1/rpc/team_set_roles" \
            -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -d '{"p_operation_id":"99999999-0000-0000-0000-0000000000aa","p_lease_token":"99999999-0000-0000-0000-0000000000bb","p_roles":["instructor"]}')
          [ "$CODE" -ge 400 ] || { echo "service_role deveria ser barrado, veio $CODE"; cat /tmp/svc.out; exit 1; }
          # anon idem
          CODE2=$(curl -s -o /tmp/anon.out -w "%{http_code}" -X POST "$API_URL/rest/v1/rpc/team_set_roles" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" -d '{"p_operation_id":"99999999-0000-0000-0000-0000000000aa","p_lease_token":"99999999-0000-0000-0000-0000000000bb","p_roles":["instructor"]}')
          [ "$CODE2" -ge 400 ] || { echo "anon deveria ser barrado, veio $CODE2"; cat /tmp/anon.out; exit 1; }
          echo "PostgREST OK: T0002 por code com admin real; service_role ($CODE) e anon ($CODE2) barrados"
      - name: Edge manage-team servida de VERDADE (smoke + mapeamento HTTP)
        env:
          TEAM_WORKDIR: ${{ runner.temp }}/team-int-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          eval "$(supabase status --workdir "$TEAM_WORKDIR" -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY|ANON_KEY)=')"
          echo "APP_URL=https://ci.example.test" > "$TEAM_WORKDIR/.env.ci"
          supabase functions serve manage-team --workdir "$TEAM_WORKDIR" \
            --env-file "$TEAM_WORKDIR/.env.ci" --no-verify-jwt > /tmp/serve.log 2>&1 &
          SERVE_PID=$!
          FN="$API_URL/functions/v1/manage-team"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "$FN" || true)
            [ "$CODE" = "200" ] && break; sleep 2
          done
          [ "$CODE" = "200" ] || { cat /tmp/serve.log; echo "função não subiu"; exit 1; }
          # smoke sem credencial / método errado
          NOAUTH=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$FN" -H "Content-Type: application/json" -d '{}')
          [ "$NOAUTH" = "401" ] || { echo "esperado 401 sem credencial, veio $NOAUTH"; exit 1; }
          BADM=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$FN")
          [ "$BADM" = "405" ] || { echo "esperado 405 em GET, veio $BADM"; exit 1; }
          # JWT real do admin A: define senha via Admin API e faz password grant
          ADMIN_ID="00000000-0000-0000-0000-00000000000a"
          curl -s -X PUT "$API_URL/auth/v1/admin/users/$ADMIN_ID" \
            -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"password":"senha-ci-12345","email_confirm":true}' > /dev/null
          JWT=$(curl -s -X POST "$API_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d '{"email":"admin1@fabrik.test","password":"senha-ci-12345"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          [ -n "$JWT" ] || { echo "password grant falhou"; exit 1; }
          # e2e: set_roles OK (200) e retry com payload divergente = 409 por T0001
          OP="e2e00000-0000-4000-8000-000000000001"
          R1=$(curl -s -o /tmp/e2e1.out -w "%{http_code}" -X POST "$FN" \
            -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" \
            -d "{\"action\":\"set_roles\",\"operation_id\":\"$OP\",\"user_id\":\"00000000-0000-0000-0000-00000000000d\",\"roles\":[\"reception\"]}")
          [ "$R1" = "200" ] || { echo "set_roles e2e falhou ($R1)"; cat /tmp/e2e1.out; exit 1; }
          grep -q '"outcome":"roles_set"' /tmp/e2e1.out || { cat /tmp/e2e1.out; exit 1; }
          R2=$(curl -s -o /tmp/e2e2.out -w "%{http_code}" -X POST "$FN" \
            -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" \
            -d "{\"action\":\"set_roles\",\"operation_id\":\"$OP\",\"user_id\":\"00000000-0000-0000-0000-00000000000d\",\"roles\":[\"manager\"]}")
          [ "$R2" = "409" ] || { echo "esperado 409 por T0001, veio $R2"; cat /tmp/e2e2.out; exit 1; }
          grep -q '"error_code":"operation_id_conflict"' /tmp/e2e2.out || { cat /tmp/e2e2.out; exit 1; }
          kill "$SERVE_PID" || true
          echo "Edge e2e OK: 401/405, set_roles 200 e ERRCODE→HTTP (T0001→409) provados na função REAL"
